<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --ink: #171520;
      --panel: #221e30;
      --panel-2: #2c2743;
      --edge: #342e4b;
      --text: #ece8f3;
      --muted: #948da6;
      --accent: #f2b45c;
      --accent-strong: #f6c074;
      --accent-ink: #2a2013;
      --danger: #f2846b;
      --screen: #100f17;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }

    body {
      background: var(--ink);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .hidden { display: none !important; }

    /* ---------- calculator ---------- */
    .app {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .calc-card {
      width: 100%;
      max-width: 344px;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.8);
    }

    .calc-top {
      font-size: 0.82rem;
      color: var(--muted);
      padding: 2px 4px 12px;
    }

    .display {
      background: var(--screen);
      border: 1px solid var(--edge);
      border-radius: 15px;
      padding: 16px 16px 13px;
      margin-bottom: 14px;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
    }

    .expr {
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.25em;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
    }

    .result {
      font-family: var(--mono);
      font-size: clamp(1.7rem, 8vw, 2.3rem);
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1.12;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .key {
      padding: 16px 0;
      font-size: 1.2rem;
      border: none;
      border-radius: 14px;
      background: var(--panel-2);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      transition: transform 0.05s ease, filter 0.12s ease;
    }

    .key:hover { filter: brightness(1.13); }
    .key:active { transform: translateY(1px); }
    .key:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .key.func { color: var(--muted); }
    .key.op { color: var(--accent-strong); font-weight: 600; }
    .key.equals { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
    .key.span2 { grid-column: span 2; }

    /* ---------- sign in (below the calculator) ---------- */
    .signin {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--edge);
    }

    .signin-title {
      margin: 0 0 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 11px;
      border: 1px solid var(--edge);
      background: var(--screen);
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .signin input { margin-bottom: 10px; }
    input::placeholder { color: #6f6a82; }
    input:focus-visible { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: 11px;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    .btn:hover { background: var(--accent-strong); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .btn:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }

    .error {
      min-height: 1.2em;
      margin: 12px 0 0;
      color: var(--danger);
      font-size: 0.86rem;
    }

    /* ---------- chat room (behind sign in) ---------- */
    .room {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--edge);
      background: var(--ink);
    }

    .bar-mark {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--accent-strong);
    }

    .bar-right { display: flex; align-items: center; gap: 12px; }
    .whoami { font-size: 0.85rem; color: var(--muted); }

    .leave {
      border: 1px solid var(--edge);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .leave:hover { color: var(--text); border-color: var(--muted); }
    .leave:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--edge) transparent;
    }

    .feed::-webkit-scrollbar { width: 8px; }
    .feed::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 999px; }

    .empty-note {
      margin: auto;
      color: var(--muted);
      font-size: 0.92rem;
      text-align: center;
    }

    .row { display: flex; }
    .row.theirs { justify-content: flex-start; }
    .row.mine { justify-content: flex-end; }

    .bubble {
      max-width: 74%;
      padding: 9px 13px 10px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--edge);
    }

    .row.mine .bubble {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      border-bottom-right-radius: 5px;
    }

    .row.theirs .bubble { border-bottom-left-radius: 5px; }

    .meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
    .who { font-size: 0.78rem; font-weight: 700; color: var(--accent-strong); }
    .row.mine .who { color: rgba(42, 32, 19, 0.75); }
    .time { font-size: 0.68rem; color: var(--muted); }
    .row.mine .time { color: rgba(42, 32, 19, 0.6); }

    .text {
      font-size: 0.98rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 14px 18px;
      border-top: 1px solid var(--edge);
      background: var(--ink);
    }

    .msg-input { flex: 1; border-radius: 11px; }
    .send { width: auto; padding-left: 22px; padding-right: 22px; }

    @media (max-width: 480px) {
      .bubble { max-width: 84%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <!-- ============ calculator (what everyone sees) ============ -->
  <main id="calc-view" class="app">
    <div class="calc-card">
      <div class="calc-top">Calculator</div>

      <div class="display">
        <div id="expr" class="expr"></div>
        <div id="result" class="result">0</div>
      </div>

      <div id="keys" class="keys">
        <button class="key func span2" data-action="clear">C</button>
        <button class="key func" data-action="back">⌫</button>
        <button class="key op" data-action="op" data-op="/">÷</button>

        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>
        <button class="key op" data-action="op" data-op="*">×</button>

        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>
        <button class="key op" data-action="op" data-op="-">−</button>

        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>
        <button class="key op" data-action="op" data-op="+">+</button>

        <button class="key span2" data-digit="0">0</button>
        <button class="key" data-action="dot">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>

      <div class="signin">
        <p class="signin-title">Sign in</p>
        <input id="username" type="text" autocomplete="off" maxlength="40"
               placeholder="Username" aria-label="Username" />
        <input id="password" type="password" autocomplete="off"
               placeholder="Password" aria-label="Password" />
        <button id="signin" class="btn">Sign in</button>
        <p id="signin-error" class="error" role="alert"></p>
      </div>
    </div>
  </main>

  <!-- ============ chat room (behind sign in) ============ -->
  <div id="room" class="room hidden">
    <header class="bar">
      <div class="bar-mark" data-room-name>computing simple q&a</div>
      <div class="bar-right">
        <span id="whoami" class="whoami"></span>
        <button id="leave" class="leave">Leave</button>
      </div>
    </header>

    <div id="feed" class="feed" aria-live="polite"></div>

    <form id="composer" class="composer">
      <input id="msg" class="msg-input" type="text" autocomplete="off"
             maxlength="2000" placeholder="say something…" />
      <button id="send" class="btn send" type="submit">Send</button>
    </form>
  </div>

  <script>
    // ---- room name (only shows once you're inside) ----
    const ROOM_NAME = "computing simple q&a";
    const POLL_MS = 2000;

    const els = {
      calcView: document.getElementById("calc-view"),
      room: document.getElementById("room"),
      expr: document.getElementById("expr"),
      result: document.getElementById("result"),
      keys: document.getElementById("keys"),
      username: document.getElementById("username"),
      password: document.getElementById("password"),
      signin: document.getElementById("signin"),
      signinError: document.getElementById("signin-error"),
      feed: document.getElementById("feed"),
      composer: document.getElementById("composer"),
      msg: document.getElementById("msg"),
      send: document.getElementById("send"),
      whoami: document.getElementById("whoami"),
      leave: document.getElementById("leave"),
    };

    document.querySelectorAll("[data-room-name]").forEach((n) => {
      n.textContent = ROOM_NAME;
    });

    /* =======================================================
       CALCULATOR  (a real, working 4-function calculator)
       ======================================================= */
    let current = "0";
    let previous = null; // stored number
    let operator = null; // "+", "-", "*", "/"
    let waiting = false; // just pressed an operator, waiting for next number
    let evaluated = false; // last action was "="

    const SYMBOLS = { "+": "+", "-": "−", "*": "×", "/": "÷" };

    function updateDisplay() {
      els.result.textContent = current;
      els.expr.textContent =
        operator && previous !== null ? previous + " " + SYMBOLS[operator] : "";
    }

    function inputDigit(d) {
      if (evaluated) {
        current = d;
        previous = null;
        operator = null;
        evaluated = false;
      } else if (waiting) {
        current = d;
        waiting = false;
      } else if (current === "0") {
        current = d;
      } else if (current.length < 14) {
        current += d;
      }
      updateDisplay();
    }

    function inputDot() {
      if (evaluated) {
        current = "0.";
        previous = null;
        operator = null;
        evaluated = false;
      } else if (waiting) {
        current = "0.";
        waiting = false;
      } else if (!current.includes(".")) {
        current += ".";
      }
      updateDisplay();
    }

    function clearAll() {
      current = "0";
      previous = null;
      operator = null;
      waiting = false;
      evaluated = false;
      updateDisplay();
    }

    function backspace() {
      if (waiting || evaluated) return;
      current = current.length > 1 ? current.slice(0, -1) : "0";
      updateDisplay();
    }

    function compute(a, b, op) {
      let r;
      if (op === "+") r = a + b;
      else if (op === "-") r = a - b;
      else if (op === "*") r = a * b;
      else if (op === "/") {
        if (b === 0) return null; // no dividing by zero
        r = a / b;
      } else return b;
      return Number.parseFloat(r.toPrecision(12)); // trim float noise
    }

    function chooseOperator(op) {
      const value = Number.parseFloat(current);
      if (Number.isNaN(value)) return; // e.g. showing "Error"

      if (operator && waiting) {
        operator = op; // swap the operator if they tap two in a row
        updateDisplay();
        return;
      }

      if (previous === null) {
        previous = value;
      } else if (!waiting) {
        const r = compute(previous, value, operator);
        if (r === null) return showError();
        previous = r;
        current = String(r);
      }

      operator = op;
      waiting = true;
      evaluated = false;
      updateDisplay();
    }

    function equals() {
      if (operator === null || previous === null) return;
      const value = Number.parseFloat(current);
      if (Number.isNaN(value)) return;

      const r = compute(previous, value, operator);
      if (r === null) return showError();

      current = String(r);
      previous = null;
      operator = null;
      waiting = false;
      evaluated = true;
      updateDisplay();
    }

    function showError() {
      current = "Error";
      previous = null;
      operator = null;
      waiting = false;
      evaluated = true; // next digit starts fresh
      updateDisplay();
    }

    els.keys.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      if (btn.dataset.digit) return inputDigit(btn.dataset.digit);
      switch (btn.dataset.action) {
        case "dot": return inputDot();
        case "clear": return clearAll();
        case "back": return backspace();
        case "op": return chooseOperator(btn.dataset.op);
        case "equals": return equals();
      }
    });

    // Keyboard works too — but only on the calculator, and not while typing
    // into the username/password boxes.
    document.addEventListener("keydown", (e) => {
      if (!els.room.classList.contains("hidden")) return; // we're in chat
      if (document.activeElement === els.username || document.activeElement === els.password) return;

      if (e.key >= "0" && e.key <= "9") { inputDigit(e.key); e.preventDefault(); }
      else if (e.key === ".") { inputDot(); e.preventDefault(); }
      else if (["+", "-", "*", "/"].includes(e.key)) { chooseOperator(e.key); e.preventDefault(); }
      else if (e.key === "Enter" || e.key === "=") { equals(); e.preventDefault(); }
      else if (e.key === "Backspace") { backspace(); e.preventDefault(); }
      else if (e.key === "Escape" || e.key.toLowerCase() === "c") { clearAll(); e.preventDefault(); }
    });

    updateDisplay();

    /* =======================================================
       SIGN IN + CHAT
       ======================================================= */
    let session = null; // { name, password, clientId }
    let pollTimer = null;
    let renderedIds = new Set();

    function getClientId() {
      let id = sessionStorage.getItem("chat_client_id");
      if (!id) {
        id = "c-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
        sessionStorage.setItem("chat_client_id", id);
      }
      return id;
    }

    function saveSession(s) {
      sessionStorage.setItem("chat_name", s.name);
      sessionStorage.setItem("chat_pw", s.password);
    }

    function loadSession() {
      const name = sessionStorage.getItem("chat_name");
      const password = sessionStorage.getItem("chat_pw");
      if (name && password) return { name, password, clientId: getClientId() };
      return null;
    }

    function clearSession() {
      sessionStorage.removeItem("chat_name");
      sessionStorage.removeItem("chat_pw");
    }

    async function attemptSignIn() {
      const name = els.username.value.trim();
      const password = els.password.value;
      els.signinError.textContent = "";

      if (!name || !password) {
        els.signinError.textContent = "Enter a username and password.";
        return;
      }

      els.signin.disabled = true;
      els.signin.textContent = "Signing in…";

      // The password is checked by the backend (it never ships in this file).
      const res = await fetch("/api/messages", {
        headers: { "x-room-password": password },
      }).catch(() => null);

      els.signin.disabled = false;
      els.signin.textContent = "Sign in";

      if (!res) { els.signinError.textContent = "Couldn't sign in. Try again."; return; }
      if (res.status === 401) { els.signinError.textContent = "Incorrect username or password."; els.password.select(); return; }
      if (!res.ok) { els.signinError.textContent = "Something went wrong. Try again."; return; }

      session = { name, password, clientId: getClientId() };
      saveSession(session);
      enterRoom();

      try {
        const data = await res.json();
        renderMessages(data.messages || [], true);
      } catch {}
    }

    function enterRoom() {
      els.calcView.classList.add("hidden");
      els.room.classList.remove("hidden");
      els.whoami.textContent = session.name;
      document.title = ROOM_NAME;
      els.msg.focus();
      startPolling();
    }

    function leaveRoom() {
      stopPolling();
      clearSession();
      session = null;
      renderedIds = new Set();
      els.feed.innerHTML = "";
      els.room.classList.add("hidden");
      els.calcView.classList.remove("hidden");
      els.password.value = "";
      document.title = "Calculator";
    }

    function startPolling() {
      fetchMessages();
      pollTimer = setInterval(fetchMessages, POLL_MS);
    }

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    async function fetchMessages() {
      if (!session) return;
      let res;
      try {
        res = await fetch("/api/messages", {
          headers: { "x-room-password": session.password },
        });
      } catch {
        return; // network blip — try again next tick
      }
      if (res.status === 401) { leaveRoom(); return; }
      if (!res.ok) return;
      let data;
      try { data = await res.json(); } catch { return; }
      renderMessages(data.messages || [], false);
    }

    function nearBottom() {
      const el = els.feed;
      return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    }

    function renderMessages(messages, initial) {
      const emptyNote = els.feed.querySelector(".empty-note");

      if (!messages.length) {
        if (!emptyNote) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "Nobody's said anything yet. Break the ice.";
          els.feed.appendChild(note);
        }
        return;
      }
      if (emptyNote) emptyNote.remove();

      const stick = initial || nearBottom();

      for (const m of messages) {
        if (renderedIds.has(m.id)) continue;
        renderedIds.add(m.id);
        els.feed.appendChild(buildBubble(m));
      }

      if (stick) els.feed.scrollTop = els.feed.scrollHeight;
    }

    function buildBubble(m) {
      const mine = m.clientId && session && m.clientId === session.clientId;

      const row = document.createElement("div");
      row.className = "row " + (mine ? "mine" : "theirs");

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const meta = document.createElement("div");
      meta.className = "meta";

      const who = document.createElement("span");
      who.className = "who";
      who.textContent = mine ? "you" : (m.name || "anon");

      const time = document.createElement("span");
      time.className = "time";
      time.textContent = formatTime(m.ts);

      meta.appendChild(who);
      meta.appendChild(time);

      const text = document.createElement("div");
      text.className = "text";
      text.textContent = m.text; // textContent keeps typed HTML from running

      bubble.appendChild(meta);
      bubble.appendChild(text);
      row.appendChild(bubble);
      return row;
    }

    function formatTime(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      let h = d.getHours();
      const m = String(d.getMinutes()).padStart(2, "0");
      const ampm = h >= 12 ? "pm" : "am";
      h = h % 12 || 12;
      return h + ":" + m + " " + ampm;
    }

    async function sendMessage(e) {
      if (e) e.preventDefault();
      const text = els.msg.value.trim();
      if (!text || !session) return;

      els.send.disabled = true;

      let res;
      try {
        res = await fetch("/api/send", {
          method: "POST",
          headers: {
            "content-type": "application/json",
            "x-room-password": session.password,
          },
          body: JSON.stringify({
            name: session.name,
            text,
            clientId: session.clientId,
          }),
        });
      } catch {
        els.send.disabled = false;
        flashInputError("Message didn't send — try again.");
        return;
      }

      els.send.disabled = false;

      if (res.status === 401) { leaveRoom(); return; }
      if (!res.ok) { flashInputError("Message didn't send — try again."); return; }

      els.msg.value = "";
      els.msg.focus();
      fetchMessages();
    }

    function flashInputError(text) {
      els.msg.placeholder = text;
      setTimeout(() => { els.msg.placeholder = "say something…"; }, 2500);
    }

    // ---- wire up sign in + chat ----
    els.signin.addEventListener("click", attemptSignIn);
    els.username.addEventListener("keydown", (e) => { if (e.key === "Enter") els.password.focus(); });
    els.password.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptSignIn(); });
    els.composer.addEventListener("submit", sendMessage);
    els.leave.addEventListener("click", leaveRoom);

    // ---- resume a session if there is one ----
    session = loadSession();
    if (session) enterRoom();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Help</title>
  <style>
    /* little formatting — just enough so images behave */
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; line-height: 1.5; }
    figure { margin: 22px 0; }
    figure img { max-width: 100%; height: auto; display: block; }
    figcaption { font-size: 0.85rem; color: #666; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Help desk</h1>

  <p>Struggling with our site? No problem!</p>


  <!-- ============================================================
       HOW TO ADD AN IMAGE OR A GIF

       Copy one <figure> block below, then change:
         src  = path to your image (.png, .jpg, or .gif — gifs animate on their own)
         alt  = short description (shows if the image can't load)
         <figcaption> = the caption underneath (optional; delete the line to skip it)

       Where the image files live:
         - Upload them to your repo (Add file -> Upload files), e.g. into an
           "images" folder, then point src at  /images/yourfile.png
         - Or use a full web address like  https://example.com/yourfile.gif

       The two examples below use placeholder images so you can see it working —
       swap the src for your own.
       ============================================================ -->

  <figure>
    <img src="/media/speedlaugh.gif" alt="example image" />
    <figcaption>Bro really thought</figcaption>
  </figure>

  <figure>
    <img src="/media/folkcat.jpg" alt="example gif" />
    <figcaption>No way</figcaption>
  </figure>

</body>
</html>
